name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas
  workflow_dispatch:         # permite ejecutarlo manualmente desde Actions

permissions:
  actions: write             # necesario para el paso que evita la desactivación del cron

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la base de datos de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL="${SUPABASE_URL:-https://mshsowaeukiejpryjibk.supabase.co}"

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ Falta el secret SUPABASE_ANON_KEY en el repositorio."
            exit 1
          fi

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 3 --retry-delay 10 --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$URL/rest/v1/proyectos?select=codigo&limit=1")

          echo "Código HTTP recibido: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Consulta a la tabla 'proyectos' realizada con éxito."
          else
            echo "⚠️ Respuesta inesperada (HTTP $HTTP_STATUS)."
            exit 1
          fi

      - name: Evitar que GitHub desactive este cron por inactividad
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/keep-alive.yml/enable"
